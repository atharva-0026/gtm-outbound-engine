name: dependency audit

# Monthly pip-audit (issue #1): fails on any new vulnerability, and on the
# accepted chromadb advisories once upstream ships a fix - see
# scripts/audit_check.py and SECURITY.md.
on:
  schedule:
    - cron: "17 4 1 * *"  # 04:17 UTC on the 1st of each month
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "requirements*.txt"
      - "scripts/audit_check.py"
      - ".github/workflows/audit.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit requirements.txt
        run: |
          set -o pipefail
          pip-audit -r requirements.txt --format json --progress-spinner off > audit.json || true
          python scripts/audit_check.py < audit.json
